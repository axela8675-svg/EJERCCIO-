<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Primer Formulario HTML</title>
<link type="text/css" rel="stylesheet" href="css/style.css"/>
</head>
<body>

    <h2>Formulario de Registro</h2>

    <!-- La etiqueta <form> envuelve todos los elementos del formulario -->
    <form action="/enviar-datos" method="POST">
        
        <!-- Campo para el Nombre -->
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="usuario_nombre" placeholder="Escribe tu nombre" required>
        </div>
        <br>

        <!-- Campo para el Correo Electrónico -->
        <div>
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="usuario_correo" placeholder="JOSUE@correo.com" required>
        </div>
        <br>

        <!-- Campo para la Contraseña -->
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="usuario_password" required>
        </div>
        <br>

        <!-- Botón para enviar el formulario -->
        <div>
            <button type="submit">Registrarse</button>
        </div>

    </form>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>
